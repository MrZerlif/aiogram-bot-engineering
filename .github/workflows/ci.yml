name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Synchronize test dependencies
        run: uv sync --locked --python 3.10 --group test

      - name: Lint skill contract
        run: uv run --locked --group test python scripts/lint_skill_contract.py .

      - name: Run code tests
        run: uv run --locked --group test pytest -q

      - name: Type-check scripts and example
        run: uv run --locked --group test mypy scripts skill/aiogram-bot-engineering/examples

      - name: Smoke-test the import-safe example
        run: uv run --locked --group test pytest -q tests/code/test_dialog_bot.py
