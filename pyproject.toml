[project]
name = "aiogram-bot-engineering-tooling"
version = "0.0.0"
description = "Repository QA tooling for the aiogram-bot-engineering Codex skill"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
test = [
    "aiogram==3.30.0",
    "aiogram-dialog==2.6.0",
    "mypy>=1.19,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
testpaths = ["tests/code"]

[tool.mypy]
python_version = "3.10"
allow_redefinition_new = true
local_partial_types = true
show_error_codes = true
warn_unused_configs = true
